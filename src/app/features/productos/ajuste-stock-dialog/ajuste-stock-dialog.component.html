<div class="drawer-backdrop" (click)="cerrar.emit()"></div>
<div class="dialogo" role="dialog" aria-modal="true" aria-label="Registrar movimiento de stock">
  <header class="dialogo__header">
    <h2>Movimiento de stock</h2>
    <button type="button" class="btn-icono" (click)="cerrar.emit()" aria-label="Cerrar">✕</button>
  </header>

  <p class="dialogo__producto">
    <strong>{{ producto.nombre }}</strong>
    <span>Stock actual: {{ producto.stock_actual ?? 0 }} {{ producto.unidad_medida }}</span>
  </p>

  <div class="dialogo__tipo">
    <button type="button" [class.activo]="tipo === 'INGRESO'" (click)="tipo = 'INGRESO'">Ingreso</button>
    <button type="button" [class.activo]="tipo === 'SALIDA'" (click)="tipo = 'SALIDA'">Salida</button>
  </div>

  <label>
    Cantidad
    <input type="number" min="1" [(ngModel)]="cantidad" />
  </label>

  <label>
    Motivo
    <select [(ngModel)]="motivo">
      <option *ngFor="let m of motivosDisponibles" [value]="m">{{ m }}</option>
    </select>
  </label>

  <p class="campo-error" *ngIf="error">{{ error }}</p>

  <div class="dialogo__acciones">
    <button type="button" class="btn-secundario" (click)="cerrar.emit()">Cancelar</button>
    <button type="button" class="btn-primario" [disabled]="guardando" (click)="aplicar()">
      {{ guardando ? 'Registrando…' : 'Registrar movimiento' }}
    </button>
  </div>
</div>
