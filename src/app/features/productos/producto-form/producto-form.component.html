<div class="drawer-backdrop" (click)="cerrar.emit()"></div>
<aside class="drawer" role="dialog" aria-modal="true" [attr.aria-label]="esEdicion ? 'Editar producto' : 'Nuevo producto'">
  <header class="drawer__header">
    <h2>{{ esEdicion ? 'Editar producto' : 'Nuevo producto' }}</h2>
    <button type="button" class="btn-icono" (click)="cerrar.emit()" aria-label="Cerrar">✕</button>
  </header>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="drawer__form">
    <div class="campo-imagen">
      <div class="campo-imagen__preview">
        <img *ngIf="imagenBase64" [src]="imagenBase64" alt="Foto del producto" />
        <span *ngIf="!imagenBase64" class="campo-imagen__sin-foto">Sin foto</span>
      </div>
      <div class="campo-imagen__acciones">
        <label class="btn-secundario btn-archivo">
          {{ imagenBase64 ? 'Cambiar foto' : 'Agregar foto' }}
          <input type="file" accept="image/png, image/jpeg" (change)="onImagenSeleccionada($event)" hidden />
        </label>
        <button type="button" class="btn-texto" *ngIf="imagenBase64" (click)="quitarImagen()">Quitar</button>
      </div>
      <small class="campo-ayuda">Opcional — ayuda a identificar el producto en el listado y al vender.</small>
      <small class="campo-error" *ngIf="errorImagen">{{ errorImagen }}</small>
    </div>

    <label>
      Nombre
      <input type="text" formControlName="nombre" placeholder="Ej. Arroz Costeño 5kg" />
      <small class="campo-error" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
        El nombre es obligatorio.
      </small>
    </label>

    <label>
      Código de barras
      <div class="campo-con-boton">
        <input type="text" formControlName="codigo_barras" placeholder="Escanéalo o escríbelo" />
        <button type="button" class="btn-secundario btn-escanear" (click)="abrirScanner()">📷 Escanear</button>
      </div>
    </label>

    <div class="drawer__fila">
      <label>
        Precio de compra (S/)
        <input type="number" step="0.01" formControlName="precio_compra" />
      </label>
      <label>
        Precio de venta (S/)
        <input type="number" step="0.01" formControlName="precio_venta" />
      </label>
    </div>
    <small class="campo-alerta" *ngIf="margenNegativo">
      El precio de venta no supera al de compra: este producto no generará ganancia.
    </small>

    <div class="drawer__fila">
      <label>
        Unidad de medida
        <select formControlName="unidad_medida">
          <option value="unidad">Unidad</option>
          <option value="kg">Kilogramo</option>
          <option value="litro">Litro</option>
          <option value="caja">Caja</option>
          <option value="paquete">Paquete</option>
        </select>
      </label>
      <label>
        Stock mínimo
        <input type="number" step="1" formControlName="stock_minimo" />
      </label>
    </div>

    <label *ngIf="!esEdicion">
      Stock inicial
      <input type="number" step="1" formControlName="stock_inicial" />
      <small class="campo-ayuda">Se registrará automáticamente como un ingreso de inventario.</small>
    </label>

    <p class="campo-error" *ngIf="errorGeneral">{{ errorGeneral }}</p>

    <div class="drawer__acciones">
      <button type="button" class="btn-secundario" (click)="cerrar.emit()">Cancelar</button>
      <button type="submit" class="btn-primario" [disabled]="guardando">
        {{ guardando ? 'Guardando…' : 'Guardar producto' }}
      </button>
    </div>
  </form>
</aside>

<app-barcode-scanner
  *ngIf="mostrarScanner"
  (detectado)="onCodigoDetectado($event)"
  (cerrar)="mostrarScanner = false"
></app-barcode-scanner>
